<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FindJoy · 人生分享海报样稿</title>
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px 16px; background: var(--fj-color-background); color: var(--fj-color-text); font-family: 'DM Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .poster-frame { width: min(540px, 100%); margin: auto; container-type: inline-size; }
    .poster { width: 540px; zoom: calc(100cqw / 540px); height: 810.0000px; font-size: 13.9860px; background: var(--fj-color-brand); padding: 28.0800px 23.9760px 28px; display: flex; flex-direction: column; }
    .heading { padding: 0 15.9840px; color: var(--fj-color-text-inverse); }
    .eyebrow { margin: 0; font-size: 9.9900px; font-weight: 600; letter-spacing: .2em; }
    h1 { margin: 15.9840px 0 11.9880px; font-family: 'Songti SC', 'Noto Serif CJK SC', serif; font-size: 44.0100px; font-weight: 500; line-height: 1.25; letter-spacing: .06em; }
    .heading-bottom { margin-bottom: 23.9760px; font-size: 11.9880px; }
    .paper { flex: 1; min-height: 0; border-radius: 23.9760px; background: var(--fj-color-text-inverse); padding: 19.9800px 27.9720px; display: flex; flex-direction: column; }
    .identity { display: flex; align-items: center; gap: 11.9880px; }
    .logo { width: 100.0080px; height: 38.0160px; overflow: hidden; position: relative; flex-shrink: 0; }
    .logo img { width: 172.8000px; height: 59.4000px; max-width: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
    .story { margin-top: 15.9840px; }
    .label { margin: 0; color: var(--fj-color-brand); font-size: 11.0160px; letter-spacing: .12em; }
    h2 { margin: 11.9880px 0 15.9840px; font-family: 'Songti SC', 'Noto Serif CJK SC', serif; font-size: 29.9700px; font-weight: 600; line-height: 1.4; letter-spacing: .02em; }
    .moments { display: grid; gap: 8px; margin: 0; }
    .moment { display: grid; grid-template-columns: 48.0060px 1fr; gap: 11.9880px; align-items: baseline; }
    .moment dt { color: var(--fj-color-accent-readable); font-size: 13.9860px; }
    .moment dd { margin: 0; font-size: 13.9860px; line-height: 1.8; }
    .question { margin: 12px 0; font-family: 'Songti SC', 'Noto Serif CJK SC', serif; font-size: 17.9820px; line-height: 1.65; }
    .tear { position: relative; border-top: 1px dashed var(--fj-color-border); margin: auto -27.9720px 0; }
    .tear::before, .tear::after { content: ''; position: absolute; top: -9.9900px; width: 19.9800px; height: 19.9800px; border-radius: 50%; background: var(--fj-color-brand); }
    .tear::before { left: -9.9900px; } .tear::after { right: -9.9900px; }
    .invitation { display: flex; justify-content: space-between; align-items: center; gap: 15.9840px; padding-top: 12px; }
    .invitation p { margin: 0 0 7.9920px; font-size: 17.9820px; font-weight: 500; }
    .invitation small { font-size: 11.0160px; color: var(--fj-color-text-muted); line-height: 1.8; }
    .qr { width: 79.9740px; height: 79.9740px; object-fit: contain; flex-shrink: 0; }
    .footer { flex-shrink: 0; padding-top: 20px; line-height: 16px; text-align: center; color: var(--fj-color-text-inverse); font-size: 11.0160px; letter-spacing: .14em; }
    .note { max-width: 540px; margin: 16px auto 0; color: var(--fj-color-text-muted); font-size: 12px; line-height: 1.8; text-align: center; }
    .toolbar { max-width: 540px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: space-between; }
    .toolbar p { margin: 0; font-size: 14px; color: var(--fj-color-text-muted); }
    button, .save-button { font: inherit; cursor: pointer; }
    .icon-button { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--fj-color-border); border-radius: 12px; color: var(--fj-color-text); background: var(--fj-color-text-inverse); }
    .icon-button:hover { background: var(--fj-color-surface-muted); }
    .icon-button svg { width: 20px; height: 20px; }
    button:focus-visible, .save-button:focus-visible { outline: 2px solid var(--fj-color-focus); outline-offset: 3px; }
    .share-dialog { width: min(540px, calc(100% - 32px)); max-height: calc(100dvh - 32px); padding: 0; border: 0; border-radius: 0; color: var(--fj-color-text-inverse); background: transparent; box-shadow: none; }
    .share-dialog::backdrop { background: color-mix(in srgb, var(--fj-color-text) 80%, transparent); }
    .dialog-title { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .dialog-art { position: relative; width: min(100%, calc((100dvh - 200px) / 1.5)); margin: 0 auto; }
    .dialog-preview { display: block; width: 100%; height: auto; }
    .share-close { position: absolute; top: 0; right: 0; width: 44px; height: 44px; border: 0; border-radius: 0; background: color-mix(in srgb, var(--fj-color-text) 24%, transparent); color: var(--fj-color-text-inverse); }
    .share-close:hover { background: color-mix(in srgb, var(--fj-color-text) 50%, transparent); }
    .dialog-actions { padding: 24px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
    .save-button { width: fit-content; min-width: 200px; min-height: 48px; margin: 0 auto; padding: 12px 28px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--fj-color-text-inverse); border-radius: 999px; background: transparent; color: var(--fj-color-text-inverse); text-decoration: none; font-size: 16px; }
    .save-button:hover { background: color-mix(in srgb, var(--fj-color-text-inverse) 16%, transparent); }
    .save-button svg { width: 20px; height: 20px; }
    @media (max-width: 400px) { body { padding: 16px 12px; } }
  </style>
</head>
<body>
  <main>
    <div class="toolbar">
      <p>人生分享海报 · 交互样稿</p>
      <button class="icon-button" id="share-trigger" type="button" aria-label="分享海报" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4"/></svg>
      </button>
    </div>
    <div class="poster-frame">
    <article class="poster" aria-label="人生分享海报设计样稿">
      <header class="heading">
        <p class="eyebrow">A LIFE REMEMBERED</p>
        <h1>我在人间<br>走了一回</h1>
        <div class="heading-bottom"><span>人生没有答案，只有选择</span></div>
      </header>
      <section class="paper" aria-label="人生回顾示例">
        <div class="identity">
          <span class="logo"><img src="../../public/findjoy-logo.svg" alt="findjoy."></span>
        </div>
        <div class="story">
          <p class="label">普通模式 · 享年 81 岁</p>
          <h2>这一生，我有过很多次<br>离开的机会<br>但我选择了留下</h2>
          <dl class="moments">
            <div class="moment"><dt>27 岁</dt><dd>放弃了第一次创业机会</dd></div>
            <div class="moment"><dt>34 岁</dt><dd>第一次选择家庭，而不是晋升</dd></div>
            <div class="moment"><dt>往后</dt><dd>慢慢学会，按自己的判断生活</dd></div>
          </dl>
          <p class="question">如果这是你的一生<br>你愿意这样活吗？</p>
        </div>
        <div class="tear" aria-hidden="true"></div>
        <div class="invitation">
          <div><p>换作你，会怎么选？</p><small>长按识别二维码<br>来 FindJoy，经历另一种人生</small></div>
          <img class="qr" src="../../public/findjoy-qr.png" alt="FindJoy 产品入口二维码">
        </div>
      </section>
      <footer class="footer">FINDJOY 觅乐 · 另一种人生，另一种可能</footer>
    </article>
    </div>
    <p class="note">视觉样稿 · 文案取自产品回顾示例，非真实玩家记录<br>二维码暂用现有产品入口，未接入单局分享</p>
  </main>
  <dialog class="share-dialog" id="share-dialog" aria-labelledby="share-title">
    <h2 class="dialog-title" id="share-title">分享这一生</h2>
    <div class="dialog-art">
      <img class="dialog-preview" src="findjoy-poster.png" width="1080" height="1620" alt="FindJoy 人生分享海报预览">
      <button class="icon-button share-close" id="share-close" type="button" aria-label="关闭分享弹窗" autofocus>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg>
      </button>
    </div>
