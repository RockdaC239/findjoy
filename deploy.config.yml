# ============================================================
# 部署登记表（三层部署模型的第二层）
# 只写【项目差异】：换一个项目才需要改这里。
# 服务器通用动作（systemd / nginx / 健康检查）在执行层 deploy/deploy-production.sh。
# ============================================================
project:
  name: findjoy
  type: nextjs            # Node.js 应用（Next.js + API 路由 + SQLite）

runtime:
  node: ">=20.9.0"        # Next.js 16 要求；服务器由 bootstrap 脚本装 Node 20
  node_install: NodeSource setup_20.x

# 构建与启动命令（执行层按此执行）
build:
  command: npm ci && npm run build

start:
  command: npm run start -- -H 127.0.0.1 -p {app_port}

# 端口登记：新项目先在这里登记，执行层复用，避免端口漂移
ports:
  app: 3030               # 内部端口（next start 只监听 127.0.0.1）
  public: 3939            # 对外端口（nginx 监听，腾讯云安全组需放行）

health:
  url: http://127.0.0.1:3030/
  retries: 30

nginx:
  server_name: _          # 先用 IP 访问；绑定域名后改成你的域名
  client_max_body_size: 10m

# 服务器路径（由 GitHub Secrets 里的 DEPLOY_USER 决定，默认 rocc）
paths:
  src: /home/rocc/apps/findjoy/src
  env: /home/rocc/apps/findjoy/.env
  data: /home/rocc/apps/findjoy/data   # SQLite 持久化目录（LIFE_DB_PATH 指向这里）

environments:
  production:
    branch: main
    # 连接信息不写死，从 GitHub Secrets 读取：
    #   DEPLOY_HOST  服务器公网 IP
    #   DEPLOY_USER  SSH 用户（默认 rocc）
    #   DEPLOY_SSH_KEY  部署私钥（bootstrap 生成）
    #   APP_ENV      应用环境变量（.env 内容）
    server:
      host: <填服务器公网IP>
      user: rocc
      path: /home/rocc/apps/findjoy
