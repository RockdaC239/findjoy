# ============================================================
# 部署登记表（三层部署模型的第二层）
# 只写【项目差异】：换一个项目才需要改这里。
# 服务器通用动作（systemd / nginx / 健康检查）在执行层 deploy/deploy-production.sh。
# ============================================================
project:
  name: findjoy
  type: nextjs            # Node.js 应用（Next.js + API 路由 + SQLite）

runtime:
  node: ">=22"            # better-sqlite3@13 要求 Node >= 22；服务器与 CI 均装 Node 22
  node_install: NodeSource setup_22.x

# 构建与启动命令（执行层按此执行）
build:
  command: npm ci && npm run build

start:
  command: npm run start -- -H 127.0.0.1 -p {app_port}

# 端口登记：新项目先在这里登记，执行层复用，避免端口漂移
ports:
  app: 3001               # 内部端口（next start 只监听 127.0.0.1）

# 对外访问：findfire.club/findjoy（nginx 完整转发前缀，Next.js basePath 处理）
public_base: /findjoy
health:
  url: http://127.0.0.1:3001/findjoy
  retries: 30

nginx:
  server_name: findfire.club   # 域名；findjoy 挂载在 /findjoy/ 子路径
  listen: 80                   # HTTP；证书就绪后自动 301 跳转 HTTPS
  client_max_body_size: 10m
  # HTTPS：certs/ 下存在证书即自动启用（见 deploy/deploy-production.sh）
  # 证书覆盖 SERVER_NAME 时自动给 443 加主域名站点；证书 SAN 含 www 时再给 www 加 301 跳转
  ssl_listen: 443
  ssl_cert_dir: /home/rocc/apps/findjoy/certs              # 部署不会覆盖（在 src/ 之外）
  ssl_certificate: /home/rocc/apps/findjoy/certs/findfire.club.crt      # 腾讯云 *_bundle.crt
  ssl_certificate_key: /home/rocc/apps/findjoy/certs/findfire.club.key  # 腾讯云 *.key

# 服务器路径（由 GitHub Secrets 里的 DEPLOY_USER 决定，默认 rocc）
paths:
  src: /home/rocc/apps/findjoy/src
  env: /home/rocc/apps/findjoy/.env
  data: /home/rocc/apps/findjoy/data   # SQLite 持久化目录（LIFE_DB_PATH 指向这里）

environments:
  production:
    branch: main
    # 连接信息不写死，从 GitHub Secrets 读取：
    #   DEPLOY_HOST  服务器公网 IP
    #   DEPLOY_USER  SSH 用户（默认 rocc）
    #   DEPLOY_SSH_KEY  部署私钥
    #   APP_ENV      应用环境变量（.env 内容）
    server:
      host: 124.221.235.9
      user: rocc
      path: /home/rocc/apps/findjoy
