name: 部署到腾讯云

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 使用 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查 / 测试 / Lint
        run: |
          npm run typecheck
          npm test
          npm run lint

      - name: 准备 SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 同步代码到服务器
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SERVER_PATH: /home/${{ secrets.DEPLOY_USER }}/apps/findjoy
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='.data/' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.DS_Store' \
            --exclude='*.tsbuildinfo' \
            --exclude='.playwright-mcp/' \
            --exclude='.workbuddy/' \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            ./ "$USER@$HOST:$SERVER_PATH/src/"

      - name: 执行部署脚本
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SERVER_PATH: /home/${{ secrets.DEPLOY_USER }}/apps/findjoy
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          printf '%s\n' "$APP_ENV" | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
            "$USER@$HOST" "cat > /tmp/findjoy_app_env"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no "$USER@$HOST" \
            "cd $SERVER_PATH/src && DEPLOY_USER='$USER' bash deploy/deploy-production.sh"
