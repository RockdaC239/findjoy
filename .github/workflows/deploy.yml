name: 部署到腾讯云

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.19-alpine
        env:
          POSTGRES_USER: findjoy_test
          POSTGRES_PASSWORD: findjoy_test_ci
          POSTGRES_DB: findjoy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U findjoy_test -d findjoy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://findjoy_test:findjoy_test_ci@127.0.0.1:5432/findjoy_test
    steps:
      - uses: actions/checkout@v4

      - name: 使用 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 准备 PostgreSQL 15 备份恢复客户端
        run: |
          if [ ! -x /usr/lib/postgresql/15/bin/pg_dump ]; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get update
            sudo apt-get install --yes postgresql-client-15
          fi
          echo "FINDJOY_PG_BIN=/usr/lib/postgresql/15/bin" >> "$GITHUB_ENV"

      - name: 准备 nginx 配置验证工具
        run: |
          if [ ! -x /usr/sbin/nginx ]; then
            sudo apt-get update
            sudo apt-get install --yes nginx
          fi
          echo "NGINX_BIN=/usr/sbin/nginx" >> "$GITHUB_ENV"

      - name: 生产依赖安全审计
        run: npm audit --omit=dev --audit-level=high

      - name: 类型检查 / 测试 / Lint
        run: |
          npm run typecheck
          npm test
          npm run lint

      - name: 准备 SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 计算发布版本
        id: release
        run: echo "id=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: 同步代码到服务器
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SERVER_PATH: /home/${{ secrets.DEPLOY_USER }}/apps/findjoy
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          # 先增量同步到常驻镜像目录，再在服务器本地复制到不可变发布目录。
          # 跨洋链路实测约 16 KB/s，全量 9 MB 要 7-9 分钟；镜像目录跨次复用后只传变更文件。
          # 图片只同步运行期真正用到的：app/icon.svg、public/findjoy-logo.svg（分享海报水印）、
          # public/findjoy-qr.png（分享海报/展示页二维码）、public/bookmarks/default.svg（默认封面）、
          # public/icons/wechat-pay.svg（收银台）。public/authing-brand.css 被 Authing 登录页远程引用，必须保留。
          # 展示页配图 public/deck/ 与 design/ 素材、docs/ 均不上传。
          MIRROR="$SERVER_PATH/.deploy/source"
          SSH_OPTS="-i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=no"
          ssh $SSH_OPTS "$USER@$HOST" "mkdir -p '$MIRROR' '$SERVER_PATH/releases/$RELEASE_ID'"
          rsync -az --delete --stats \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='.data/' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.DS_Store' \
            --exclude='*.tsbuildinfo' \
            --exclude='.playwright-mcp/' \
            --exclude='.workbuddy/' \
            --exclude='docs/' \
            --exclude='commercialisation/' \
            --exclude='design/brand/' \
            --exclude='design/references/' \
            --exclude='design/showcase/' \
            --exclude='design/share-poster/' \
            --exclude='design/*.md' \
            --exclude='public/deck/' \
            -e "ssh $SSH_OPTS" \
            ./ "$USER@$HOST:$MIRROR/"
          ssh $SSH_OPTS "$USER@$HOST" \
            "rsync -a --delete '$MIRROR/' '$SERVER_PATH/releases/$RELEASE_ID/'"

      - name: 执行部署脚本
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SERVER_PATH: /home/${{ secrets.DEPLOY_USER }}/apps/findjoy
          RELEASE_ID: ${{ steps.release.outputs.id }}
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          printf '%s\n' "$APP_ENV" | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
            "$USER@$HOST" "cat > /tmp/findjoy_app_env"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no "$USER@$HOST" \
            "cd '$SERVER_PATH/releases/$RELEASE_ID' && DEPLOY_USER='$USER' SERVER_PATH='$SERVER_PATH' RELEASE_ID='$RELEASE_ID' bash deploy/deploy-production.sh"
